# The VM test/vm/run.sh starts: Ubuntu 24.04 arm64 on Apple's Virtualization framework, as GitHub's ubuntu-24.04-arm runner.
vmType: vz
arch: aarch64
cpus: 4
memory: 4GiB
disk: 20GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
mountType: virtiofs
containerd:
  system: false
  user: false
