# The launcher's sway session (session.sh): the launcher fullscreen, games fullscreen above it; the session ends with the launcher.
seat * hide_cursor 1000
default_border none
output DSI-1 transform 270
output DSI-1 bg #000000 solid_color
output DSI-1 allow_tearing yes
output DSI-1 max_render_time off
# the launcher sets TouchPointer (nimrc/mygo touch-pointer): a finger drags a slider instead of scrolling; NX2L_CTL takes button names
# the touchscreen reports in the panel's portrait frame: mapped to the output, the transform turns it too
input type:touch map_to_output DSI-1
for_window [title=".*"] fullscreen enable
exec_always mako
exec sh -c "GDK_BACKEND=wayland NX2L_CTL=/run/nx2l.ctl /storage/nx2linux/launcher/nx2l-launcher > /storage/nx2linux/launcher/launcher.log 2>&1; swaymsg exit"
