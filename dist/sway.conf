# mygo-pocket's sway session (session.sh): the launcher fullscreen, games fullscreen above it; the session ends with the launcher.
# Output and touch lines are the Retroid Pocket Flip 2's (DSI-1, a portrait panel turned to landscape); change them for another handheld.
seat * hide_cursor 1000
default_border none
output DSI-1 transform 270
output DSI-1 bg #000000 solid_color
output DSI-1 allow_tearing yes
output DSI-1 max_render_time off
# the touchscreen reports in the panel's portrait frame: mapped to the output, the transform turns it too
input type:touch map_to_output DSI-1
for_window [title=".*"] fullscreen enable
exec_always mako
exec sh -c "GDK_BACKEND=wayland MYGO_POCKET_CTL=/run/mygo-pocket.ctl /storage/mygo-pocket/mygo-pocket > /storage/mygo-pocket/launcher.log 2>&1; swaymsg exit"
