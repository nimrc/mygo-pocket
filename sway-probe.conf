# MyGo probe: the probe fullscreen in a sway session of its own, which ends with it
seat * hide_cursor 1000
default_border none
output DSI-1 transform 270
output DSI-1 bg #000000 solid_color
# the touchscreen reports in the panel's portrait frame: map it to the output so the transform turns it too
input type:touch map_to_output DSI-1
for_window [title="nx2l"] fullscreen enable
exec sh -c "GDK_BACKEND=wayland /storage/nx2linux/mygo/nx2l-mygo > /storage/nx2linux/mygo/probe.log 2>&1; swaymsg exit"
